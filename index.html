<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentinel Grid</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ACT 1 -->

    <section class="hero">

        <video autoplay muted loop playsinline class="hero-video">

            <source src="assets/videos/hero-city.mp4" type="video/mp4">

        </video>

        <div class="video-overlay"></div>

        <div class="hero-content">

            <div class="eyebrow">
                EMERGENCY INTELLIGENCE NETWORK
            </div>

            <h1>
                EVERY CITY IS<br>
                DESIGNED FOR GROWTH.
            </h1>

            <p>
                Few are designed for crisis.
            </p>

        </div>

    </section>

    <!-- ACT 2 -->

    <section class="crack">

        <div class="crack-container">

            <span class="pulse"></span>

            <h2>
                Emergencies Begin In Seconds.
            </h2>

            <h3>
                Coordination Takes Minutes.
            </h3>

        </div>

    </section>

    <script src="js/app.js"></script>

</body>

</html>
